<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UX Was Here</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HERO -->
    <header class="hero" id="home">

        <nav class="navbar">

            <a href="#home" class="logo">
                <img src="images/logo.png" alt="UX Was Here logo">
            </a>

            <ul>
                <li><a href="#uxspace">MY UXSPACE</a></li>
                <li><a href="#events">EVENTS</a></li>
                <li><a href="#careers">JOB POSTINGS</a></li>
            </ul>

        </nav>

        <div class="hero-title">
            <img src="images/Frame 99482.svg" alt="UX Was Here">
        </div>

        <div class="socials">
            <span>IG</span>
            <span>in</span>
            <span>X</span>
        </div>

        <div class="scroll-text">
            ← SCROLL
        </div>

    </header>


    <main>

        <!-- ABOUT SECTION -->
        <section class="image-section">
            <img src="images/About US.png" alt="UX Was Here About Us section">
        </section>


        <!-- PORTFOLIO SECTION -->
        <section class="image-section">
            <img
                src="images/portfolio.png"
                alt="Featured UX portfolios"
            >
        </section>


        <!-- UXSPACE SECTION -->
        <section
            class="image-section"
            id="uxspace"
        >
            <img
                src="images/uxspace.png"
                alt="My UXSpace section"
            >
        </section>


        <!-- EVENTS SECTION -->
        <section
            class="image-section"
            id="events"
        >
            <img
                src="images/event-milano.png"
                alt="UX events section"
            >
        </section>


        <!-- CAREER PLACEHOLDER -->
        <section class="career-placeholder" id="careers">

            <h2>
                ELEVATE YOUR
                <span>CAREER</span>
            </h2>

            <p>
                Career section image will go here after export.
            </p>

        </section>

    </main>


    <footer>

        <div>
            <h2>UX WAS HERE</h2>
            <p>Privacy Policy</p>
            <p>Terms of Service</p>
        </div>

        <div>
            <h3>GET INVOLVED</h3>
            <p>Feedback</p>
            <p>Volunteer with us</p>
        </div>

        <div>
            <p>Roadmap</p>
            <p>Feature Request</p>
        </div>

        <div>
            <p>SIGN UP FOR OUR NEWSLETTER →</p>
            <p>FOLLOW US</p>
        </div>

    </footer>

</body>

</html>
